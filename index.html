<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kraina Liczb Kiciusia</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f7f2ff;
text-align:center;
padding:20px;
}

h1{
color:#ff69b4;
}

button{
padding:15px;
margin:8px;
border:none;
border-radius:20px;
font-size:20px;
background:#6ec6ff;
color:white;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin:20px auto;
max-width:500px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.big{
font-size:50px;
font-weight:bold;
}
</style>
</head>

<body>

<h1>🌈 Kraina Liczb Kiciusia</h1>

<div class="card">

<button onclick="addition()">
🐱 Dodawanie do 10
</button>

<button onclick="subtraction()">
🐈 Odejmowanie do 10
</button>

<button onclick="showNumber()">
👧 Jaka to liczba?
</button>

<button onclick="comparison()">
👦 Większe / Mniejsze
</button>

</div>
<div class="card">

<h2 id="score">
⭐ 0 | 🏆 Poziom 1
</h2>

</div>

<div class="card">
<div id="game">

Wybierz grę

</div>
</div>

<script>

let stars = 0;
let level = 1;
let correctAnswer = 0;

function updateScore() {

document.getElementById("score").innerHTML =
`⭐ ${stars} | 🏆 Poziom ${level}`;

}

function reward() {

stars++;

if(stars % 10 === 0){
level++;
}

updateScore();

}

function addition(){

let a=Math.floor(Math.random()*10)+1;
let b=Math.floor(Math.random()*10)+1;

correctAnswer = a+b;

document.getElementById("game").innerHTML=
`
<div class="big">${a} + ${b}</div>

<p>Ile to jest?</p>

<input id="answer" type="number">

<br><br>

<button onclick="checkMath()">
✅ Sprawdź
</button>

<div id="result"></div>
`;

}

function subtraction(){

let a=Math.floor(Math.random()*10)+1;
let b=Math.floor(Math.random()*a);

correctAnswer = a-b;

document.getElementById("game").innerHTML=
`
<div class="big">${a} - ${b}</div>

<p>Ile zostanie?</p>

<input id="answer" type="number">

<br><br>

<button onclick="checkMath()">
✅ Sprawdź
</button>

<div id="result"></div>
`;

}

function checkMath(){

let value =
parseInt(document.getElementById("answer").value);

if(value === correctAnswer){

reward();

document.getElementById("result").innerHTML =
"🌟 Brawo!";

}else{

document.getElementById("result").innerHTML =
"💡 Spróbuj jeszcze raz";

}

}

function showNumber(){

let n=Math.floor(Math.random()*100)+1;

document.getElementById("game").innerHTML=
`
<div class="big">${n}</div>

<p>Powiedz na głos jaka to liczba</p>

<button onclick="showNumber()">
➡️ Następna liczba
</button>
`;

}

function comparison(){

let a=Math.floor(Math.random()*10)+1;
let b=Math.floor(Math.random()*10)+1;

let answer;

if(a>b){
answer=">";
}else if(a<b){
answer="<";
}else{
answer="=";
}

correctAnswer = answer;

document.getElementById("game").innerHTML=
`
<div class="big">${a} ? ${b}</div>

<p>Wybierz poprawny znak</p>

<button onclick="checkCompare('>')">
>
</button>

<button onclick="checkCompare('<')">
<
</button>

<button onclick="checkCompare('=')">
=
</button>

<div id="result"></div>
`;

}

function checkCompare(choice){

if(choice===correctAnswer){

reward();

document.getElementById("result").innerHTML =
"🌟 Świetnie!";

}else{

document.getElementById("result").innerHTML =
"💡 Spróbuj jeszcze raz";

}

}

updateScore();

</script>

</body>
</html>
